# Auto PR: buat PR ke main dan aktifkan auto-merge (squash) setelah push ke branch ccr-**.
# Auto-merge butuh "Allow auto-merge" aktif di Settings repo.
name: Auto PR

on:
  push:
    branches:
      - "ccr-**"

permissions:
  contents: write
  pull-requests: write

jobs:
  buat-pr:
    runs-on: ubuntu-latest
    if: github.ref_name != 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cek ada perubahan dan PR yang sudah terbuka
        id: cek
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          COMMIT_BARU=$(git rev-list --count origin/main..HEAD)
          JUMLAH_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --state open --json number --jq 'length')
          echo "commit_baru=${COMMIT_BARU}" >> "$GITHUB_OUTPUT"
          echo "jumlah_pr=${JUMLAH_PR}" >> "$GITHUB_OUTPUT"

      - name: Buat PR ke main
        if: steps.cek.outputs.commit_baru != '0' && steps.cek.outputs.jumlah_pr == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "Perubahan dari ${GITHUB_REF_NAME}" \
            --body "PR dibuat otomatis setelah push ke \`${GITHUB_REF_NAME}\`.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - name: Aktifkan auto-merge (squash)
        if: steps.cek.outputs.commit_baru != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$GITHUB_REF_NAME"
