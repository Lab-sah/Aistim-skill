name: Auto PR

on:
  push:
    branches:
      - "ccr-**"

permissions:
  contents: read
  pull-requests: write

jobs:
  buat-pr:
    runs-on: ubuntu-latest
    if: github.ref_name != 'main'
    steps:
      - name: Cek PR yang sudah terbuka
        id: cek
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JUMLAH=$(gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq 'length')
          echo "jumlah=${JUMLAH}" >> "$GITHUB_OUTPUT"

      - name: Buat PR ke main
        if: steps.cek.outputs.jumlah == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --title "Perubahan dari ${GITHUB_REF_NAME}" \
            --body "PR dibuat otomatis setelah push ke \`${GITHUB_REF_NAME}\`.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
