name: Cek dan deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Cek struktur, keamanan, dan versi
        run: npm run cek
      - name: Tes di browser
        run: |
          npx playwright install --with-deps chromium
          npm run tes

  deploy:
    needs: cek
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Buat config dari variabel repo
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_WEBHOOK_ERROR_URL: ${{ secrets.APP_WEBHOOK_ERROR_URL }}
        run: node scripts/buat-config.mjs
      - name: Susun folder rilis
        run: |
          mkdir -p dist
          cp -r index.html src dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
